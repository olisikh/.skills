---
version: 2

skill_mirrors:
  # Claude discovers only direct children of ~/.claude/skills.
  claude:
    from: agents

submodules:
  obsidian-skills:
    exports:
      - harness: agents

  mattpocock-skills:
    exports:
      - harness: agents
        exclude:
          - deprecated/
          - personal/obsidian-vault
          - productivity/handoff
          - misc/git-guardrails-claude-code
          - in-progress/claude-handoff
      - harness: claude
        include:
          - misc/git-guardrails-claude-code
          - in-progress/claude-handoff

  llm-wiki:
    exports:
      - from: claude-plugin/skills
        harness: claude
      - from: plugins/llm-wiki-opencode/skills
        harness: opencode
      - from: plugins/llm-wiki/skills
        harness: codex

  awesome-llm-skills:
    exports:
      - from: .
        harness: agents
        exclude:
          - skill-creator
          - algorithmic-art
      - from: .
        harness: claude
        include:
          - algorithmic-art

  caveman:
    exports:
      - harness: agents
        exclude:
          - caveman-compress
          - caveman-stats

  self-improving-agent:
    exports:
      - from: .
        harness: openclaw

  graphify:
    setup:
      - uv tool install --editable .
      - graphify --version
    exports:
      - from: graphify/skill.md
        harness: claude
        to: skills/graphify/SKILL.md
      - from: graphify/skills/claude/references
        harness: claude
        to: skills/graphify/references
      - from: graphify/skill-agents.md
        harness: agents
        to: skills/graphify/SKILL.md
      - from: graphify/skills/agents/references
        harness: agents
        to: skills/graphify/references
      - from: graphify/skill-codex.md
        harness: codex
        to: skills/graphify/SKILL.md
      - from: graphify/skills/codex/references
        harness: codex
        to: skills/graphify/references
      - from: graphify/skill-opencode.md
        harness: opencode
        to: skills/graphify/SKILL.md
      - from: graphify/skills/opencode/references
        harness: opencode
        to: skills/graphify/references
      - from: graphify/skill-pi.md
        harness: pi
        to: skills/graphify/SKILL.md
      - from: graphify/skills/pi/references
        harness: pi
        to: skills/graphify/references
      - from: graphify/skill-claw.md
        harness: hermes
        to: skills/graphify/SKILL.md
      - from: graphify/skills/claw/references
        harness: hermes
        to: skills/graphify/references
